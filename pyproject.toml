[project]
name = "ua-tts-bench"
version = "0.1.0"
description = "Benchmark for Ukrainian text-to-speech models"
readme = "README.md"
authors = [
    { name = "MaksymHalych", email = "maksym.halych.24@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "openai",
    "rapidfuzz",
    "soxr",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
